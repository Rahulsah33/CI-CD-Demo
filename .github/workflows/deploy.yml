
  name: Spring Boot Build and Deploy

  on:
    push:
      branches:
        - main

  env:
    IMAGE_NAME: cicddemo

  jobs:
    build-deploy:
      runs-on: ubuntu-latest

      steps:

        # 1. Checkout source code
        - name: Checkout Source
          uses: actions/checkout@v5

        # 2. Setup Java 21
        - name: Set up JDK 21
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        # 3. Build Spring Boot application
        - name: Build Jar
          run: mvn clean package -DskipTests

        # 4. Build Docker image
        - name: Build Docker Image
          run: |
            docker build \
              -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

        # 5. Login to Docker Hub
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

        # 6. Push Docker image to Docker Hub
        - name: Push Docker Image
          run: |
            docker push \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

        # 7. Deploy Docker image to AWS EC2
        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1.2.2
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_KEY }}
            script: |
              echo "Pulling latest Docker image..."
              
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              
              echo "Stopping old container..."
              
              docker stop cicddemo || true
              
              echo "Removing old container..."
              
              docker rm cicddemo || true
              
              echo "Starting new container..."
              
              docker run -d \
                --name cicddemo \
                --restart unless-stopped \
                -p 8080:8080 \
                ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              
              echo "Removing unused Docker images..."
              
              docker image prune -f
              
              echo "Deployment completed successfully!"
  
